<!doctype html>
<!-- kore 文档站静态索引（M5-B）：零框架、零外链、断网 file:// 可开。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kore 文档站</title>
  <style>
    :root { color-scheme: dark; --bg:#0d1117; --fg:#e6edf3; --mut:#8b949e; --bd:#30363d; --ac:#58a6ff; }
    * { box-sizing: border-box; }
    body { margin:0 auto; max-width:960px; padding:2rem 1rem 4rem; background:var(--bg); color:var(--fg);
           font:14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
    h1 { font-size:1.6rem; margin:0 0 .25rem; }
    .sub { color:var(--mut); margin:0 0 1.5rem; }
    #q { width:100%; padding:.7rem .9rem; background:#161b22; color:var(--fg); border:1px solid var(--bd);
         border-radius:6px; font-size:1rem; }
    #q:focus { outline:2px solid var(--ac); outline-offset:1px; }
    .cat { margin-top:2rem; }
    .cat h2 { font-size:1.05rem; color:var(--ac); border-bottom:1px solid var(--bd); padding-bottom:.4rem; }
    ul { list-style:none; padding:0; margin:.8rem 0 0; }
    li { padding:.45rem .2rem; border-bottom:1px solid var(--bd); }
    a { color:var(--fg); text-decoration:none; }
    a:hover { color:var(--ac); text-decoration:underline; }
    .status { color:var(--mut); font-size:.8rem; margin-left:.6rem; }
    .path { color:var(--mut); font-size:.8rem; display:block; }
    .empty { color:var(--mut); padding:1rem 0; }
  </style>
</head>
<body>
  <h1>kore 文档站</h1>
  <p class="sub">离线静态索引 · 共 <span id="total">0</span> 篇 · 搜索标题或文件名即时过滤</p>
  <input id="q" type="search" placeholder="输入关键词过滤文档…" autocomplete="off" aria-label="搜索文档">
  <main id="list"></main>
  <script src="./docs.js"></script>
  <script>
    (function () {
      "use strict";
      var ORDER = ["愿景与设计", "内核与协议", "资源与数据", "前端与安全", "治理与开源", "决策 ADR"];
      var docs = (typeof window.KORE_DOCS === "object" && window.KORE_DOCS) ? window.KORE_DOCS : [];
      var list = document.getElementById("list");
      var q = document.getElementById("q");
      document.getElementById("total").textContent = String(docs.length);

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[c];
        });
      }

      function render(filter) {
        var needle = filter.trim().toLowerCase();
        var shown = 0, html = "";
        ORDER.forEach(function (cat) {
          var items = docs.filter(function (d) {
            if (d.category !== cat) return false;
            if (!needle) return true;
            return (d.title + " " + d.path).toLowerCase().indexOf(needle) !== -1;
          });
          if (!items.length) return;
          shown += items.length;
          html += '<section class="cat"><h2>' + esc(cat) + '（' + items.length + '）</h2><ul>';
          items.forEach(function (d) {
            html += '<li><a href="' + esc(d.path) + '">' + esc(d.title) + '</a>' +
                    '<span class="status">[' + esc(d.status) + ']</span>' +
                    '<span class="path">' + esc(d.path) + '</span></li>';
          });
          html += "</ul></section>";
        });
        list.innerHTML = html || '<p class="empty">无匹配文档</p>';
      }

      q.addEventListener("input", function () { render(q.value); });
      render("");
    })();
  </script>
</body>
</html>
