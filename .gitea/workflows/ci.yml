name: CI (Gitea)

# 触发（2026-11-25 用户裁决「gitea 可以按版本 ci，github 必须是主动触发」）：
#   push tag: v* 与 pkg/pluginapi/v* + 手动 workflow_dispatch。
#   GitHub 侧 .github/workflows/ci.yml 只保留 workflow_dispatch（绝不自动触发）。
#   前置：Gitea 服务端必须开启 Actions 且有可用 act_runner；本仓只提供配置，服务端启用状态未验证。
# job 主体复用 .github/workflows/ci.yml 的 steps（单一真源，禁止两处漂移）。
on:
  push:
    tags: ['v*', 'pkg/pluginapi/v*']
  workflow_dispatch:

jobs:
  check:
    name: Build + check (Gitea)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build (CGO off)
        run: make build

      - name: make check
        run: make check

      - name: make canonical-check
        run: make canonical-check

  cross:
    name: Cross build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: make docs-check
        run: make docs-check
