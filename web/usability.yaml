# 视图主流程标注（G-33 · A7「主流程 ≤3 点击」的判据真源）
#
# 每个一级菜单视图登记一条 views.<nav-id>.main_flow：小白完成该页核心任务的最短点击序列。
# 判据（scripts/usability-check.sh A7）：
#   · 每个 NAV_GROUPS 里的 nav id 必须有 main_flow 标注，缺一条 = FAIL
#   · 步数 1–3；超过 3 步必须先合并成向导（产品原则 §7③），禁止靠改标注"过门禁"
#   · 标注是承诺：人工验收（M2 小白 60 秒）会按这里写的路径实测
#
# 格式（本文件是受控 YAML 子集，脚本只认下面这种两行结构）：
#   views:
#     <nav-id>:
#       main_flow: [第 1 步, 第 2 步, 第 3 步]
views:
  backup:
    main_flow: [打开备份页, 点「创建备份」]
