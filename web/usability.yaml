# 视图主流程标注（G-33 · A7「主流程 ≤3 点击」的判据真源）
#
# 每个一级菜单视图登记一条 views.<nav-id>.main_flow：小白完成该页核心任务的最短点击序列。
# 判据（scripts/usability-check.sh A7）：
#   · 每个一级导航注册表（web/app.js 的 HUB_DEFS，随 hub 重构演进）里的 nav id 必须有
#     main_flow 标注，缺一条 = FAIL
#   · 步数 1–3；超过 3 步必须先合并成向导（产品原则 §7③），禁止靠改标注"过门禁"
#   · 标注是承诺：人工验收（M2 小白 60 秒）会按这里写的路径实测
#
# 格式（本文件是受控 YAML 子集，脚本只认下面这种两行结构）：
#   views:
#     <nav-id>:
#       main_flow: [第 1 步, 第 2 步, 第 3 步]
#
# 步数口径：一次用户可见动作算一步（导航打开页面 / 点一次按钮 / 点一次提交）。
# 表单内打字不算点击，但与「打开弹窗」「点提交」合并计为一步；括号里写的是页面上的真实按钮文案。
views:
  # 概览：只读落地页，核心任务是「一眼判断健康」；有异常时唯一的可点击去路是告警面板的「查看全部」。
  dashboard:
    main_flow: [打开概览页, 点「查看全部」看告警详情]   # 2 步
  # 数据库：页面以连接为门禁。自动检测横幅已预填 host/port/user，点「一键连接」只需补密码，不填高级参数也能成功。
  db:
    main_flow: [打开数据库页, 点「一键连接」, 填密码后点「保存」]   # 3 步
  # 文件管理：小白的核心任务是传一个文件上来。上传选中即自动开始，无需二次确认。
  files:
    main_flow: [打开文件页, 点「上传」, 在系统文件对话框选中文件并确认]   # 3 步
  # 监控：只读页，核心任务是看趋势与是否越阈值；阈值告警面板直接落在首屏。
  monitor:
    main_flow: [打开监控页, 看趋势图与「阈值告警」]   # 2 步
  # 安全：默认首屏就是防火墙（HUB_DEFS 第一个子视图），小白的核心任务是放行一个端口。
  # 「预览命令 → 执行」两步走是安全要求（先看真实 argv 再落地），不是多余点击。
  security:
    main_flow: [打开安全页, 填端口后点「预览命令」, 点「执行」]   # 3 步
  # 设置：设置项即改即存（语言 change 即生效、写入后立即记住），没有独立「保存」步骤。
  settings:
    main_flow: [打开设置页, 在「常规设置」切换语言（选完即生效）]   # 2 步
  # 网站：建站向导一次表单收齐域名 + 根目录（自动填 /var/www/<域名>）+ SSL + 伪静态，
  # 带 SSL 建站不额外加步，一次提交串行应用。
  sites:
    main_flow: [打开网站页, 点「创建第一个站点」, 填域名后点「创建站点并应用」]   # 3 步
  # 软件商店：安装是单击直达（一键安装直接进入进度，无需二次确认弹窗）。
  store:
    main_flow: [打开软件商店, 点「一键安装」]   # 2 步
  # 计划任务：常用任务预设「点一下自动填好」，确认后提交，不需要手写 cron 表达式。
  tasks:
    main_flow: [打开计划任务页, 点一个常用任务预设, 点「新增任务」]   # 3 步
  # 终端：打开即自动新建会话（无需先点「新建会话」），输入命令回车即可。
  terminal:
    main_flow: [打开终端页, 输入命令并回车]   # 2 步
  # 备份已并入「文件」一级页的第二个 tab（不再是独立一级项）；保留标注供人工验收对照。
  backup:
    main_flow: [打开备份页, 点「创建备份」]
