<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kore · 控制台</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="app">
    <div class="boot">Kore 控制台启动中…</div>
  </div>
  <!-- 静态资源统一走 /assets/ 前缀：内核只认前缀 + 后缀白名单，不枚举前端文件名。
       defer 保序：shell.js（布局壳/视图路由）先于 app.js 就绪，app.js 只在登录成功后 mount。
       store.js / files.js / sites.js / tasks.js / monitor.js / settings.js / terminal.js / db.js 八个视图模块**不在此加载**：
       由 app.js 的 ensureModule 或 shell.js 的内置路由在切到对应视图时动态注入，首屏请求数与视图数无关（FRONTEND §7）。 -->
  <!-- 语言包先于 shell：zh-CN 是默认且必载（首屏计入 gzip 预算），en-US 由 i18n.js
       在用户切到英文时懒加载（不进首屏）。两文件合计 gzip ≤ 3 KiB，见 ADR-0021。 -->
  <script src="/assets/i18n-zh-CN.js" defer></script>
  <script src="/assets/i18n.js" defer></script>
  <!-- shell.js 内置顶栏「帮助」入口（新用户求助）与未知 hash 的友好 404 页（页面不存在提示 +
       返回概览 / 去搜索下一步按钮），二者随首屏壳脚本就绪，不增请求、不破坏 Ctrl+K 全局搜索。 -->
  <script src="/assets/shell.js" defer></script>
  <script src="/assets/app.js" defer></script>
</body>
</html>
