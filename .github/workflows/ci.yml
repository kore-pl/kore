name: CI

# 触发（2026-11-25 用户裁决「gitea 可以按版本 ci，github 必须是主动触发」）：
#   GitHub Actions **只保留 workflow_dispatch**——push（main / tag）与 pull_request 全部删掉，
#   保证镜像侧的任何 push / tag 都不会自动触发 GitHub CI。版本触发在 Gitea Actions
#   (.gitea/workflows/ci.yml，push tags v* / pkg/pluginapi/v* + 手动) 上做，见 .agents/QUALITY-GATES.md §6。
#   本地 `make check`（21 段）始终是日常反馈主手段。
on:
  workflow_dispatch:


# 说明：CI 只跑能在托管 runner 上稳定复现的门禁。
# `make idle` / `make budget-check` 依赖真实 kored 进程、systemd/cgroup 与 60s 空闲采样，
# 在共享 runner 上既不可信也不稳定，因此归本地与里程碑门禁（见 .agents/QUALITY-GATES.md），CI 不跑。

jobs:
  check:
    name: Build + check (20 segments)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Build (CGO off)
        run: make build

      # 第 19 段（全仓 -race）在 make check 内执行：
      #   GOWORK=off CGO_ENABLED=1 go test -race -count=1 ./...
      # ubuntu-latest 自带 gcc，cgo 可用；cgo 不可用时 scripts/race-full-check.sh 直接 [FAIL]，
      # 不会静默跳过（跳过等于不检查数据竞争）。此处不重复执行同一条命令：
      # 门禁判据只允许一份定义，重复跑只是把 CI 时间翻倍。
      - name: make check（含第 19 段全仓 -race：go test -race ./...）
        run: make check

      - name: make canonical-check
        run: make canonical-check

  cross:
    name: Cross build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: make docs-check
        run: make docs-check
